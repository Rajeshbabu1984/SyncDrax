services:
  - type: web
    name: synctact-backend
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_KEY
        sync: false   # set this manually in Render dashboard
      # REQUIRED for data to survive: a Postgres connection string (e.g. from neon.tech or supabase.com).
      # Without it the backend uses a SQLite file that Render erases on every deploy and restart.
      - key: DATABASE_URL
        sync: false
      # Optional, only for the daily digest email. Set ONE of BREVO_API_KEY or RESEND_API_KEY, plus FROM_EMAIL.
      # Free Render instances block SMTP ports, so SMTP_* settings only work on paid plans.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      # TURN relay so video calls connect across different networks.
      # Sign up at dash.cloudflare.com (email only), then Realtime → TURN → Create key.
      # Paste the key id and the key's API token here. 1,000 GB free, then $0.05/GB.
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: METERED_TURN_DOMAIN
        sync: false
      - key: METERED_TURN_API_KEY
        sync: false
      # Or your own relay instead of Metered. TURN_URLS is comma-separated.
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  - type: web
    name: synctact-frontend
    env: static
    rootDir: frontend
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
