services:
  - type: web
    name: synctact-backend
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_KEY
        sync: false   # set this manually in Render dashboard
      # Optional, only for the daily digest email. Set ONE of BREVO_API_KEY or RESEND_API_KEY, plus FROM_EMAIL.
      # Free Render instances block SMTP ports, so SMTP_* settings only work on paid plans.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false

  - type: web
    name: synctact-frontend
    env: static
    rootDir: frontend
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
